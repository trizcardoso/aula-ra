<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula de Realidade Aumentada</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        #start-button {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            padding: 15px 30px;
            font-size: 18px;
            background-color: #007AFF;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #ar-container {
            display: none; 
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>
    <button id="start-button">Ativar Câmera / Iniciar AR</button>

    <div id="ar-container">
        <a-scene mindar-image="imageTargetSrc: ./targets.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
            
                <a-plane color="blue" opacity="0.5" position="0 0 0" width="1" height="0.552" rotation="0 0 0"></a-plane>
            
        </a-scene>
    </div>

    <script>
        const startButton = document.getElementById('start-button');
        const arContainer = document.getElementById('ar-container');

        startButton.addEventListener('click', () => {
            startButton.style.display = 'none';
            arContainer.style.display = 'block';
          
            const sceneEl = document.querySelector('a-scene');
            if (sceneEl.systems['mindar-image-system']) {
                sceneEl.systems['mindar-image-system'].start();
            }
        });
    </script>
</body>
</html>
