<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula de Realidade Aumentada</title>
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        .ui-container {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            color: white;
            font-family: sans-serif;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>
    <div class="ui-container">
        <h1>Minha aplicação WebAR</h1>
        <p>Aplicação publicada utilizando GitHub Pages.</p>
    </div>
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind;" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false"
        renderer="colorManagement: true, physicallyCorrectLights: true"
        color-space="sRGB"
        embedded>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        
            <a-plane color="blue" opacity="0.5" position="0 0 0" width="1" height="0.552" rotation="0 0 0"></a-plane>
        
    </a-scene>
</body>
</html>
