<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR com MindAR</title>

    <!-- A-Frame (necessário para a cena 3D) -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- MindAR Image Tracking (rastreamento de imagem) -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        /* Remove margens e preenche toda a tela */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000; /* fundo preto enquanto a câmera não inicia */
        }
    </style>
</head>
<body>

    <!-- A cena inicia automaticamente quando a página carrega -->
    <a-scene
        mindar-image="imageTargetSrc: ./targets.mind;"
        color-space="sRGB"
        renderer="colorManagement: true; physicallyCorrectLights: true;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
    >
        <!-- Conteúdo vinculado ao alvo de imagem (índice 0) -->
        <a-entity mindar-image-target="targetIndex: 0">
            <!-- Exemplo: um retângulo azul semitransparente sobre o alvo -->
            <a-plane
                position="0 0 0"
                width="1"
                height="0.552"
                color="blue"
                opacity="0.5"
            ></a-plane>
        </a-entity>

    </a-scene>

</body>
</html>
