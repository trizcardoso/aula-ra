<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Teste WebAR - MindAR + A-Frame</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- MindAR Image Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        .container {
            position: absolute;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <a-scene
            mindar-image="
                imageTargetSrc: ./targets.mind;
                autoStart: true;
                uiLoading: true;
                uiScanning: true;
                uiError: true;
                filterMinCF: 0.001;
                filterBeta: 0.001;
                maxTrack: 2;
            "
            embedded
            color-space="sRGB"
            renderer="
                colorManagement: true;
                physicallyCorrectLights: true;
                antialias: true;
            "
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false"
        >
            <!-- Câmera controlada pelo MindAR -->
            <a-camera
                position="0 0 0"
                look-controls="enabled: false"
                fov="60"
            ></a-camera>

            <!-- Alvo de imagem index 0 -->
            <a-entity mindar-image-target="targetIndex: 0">
                <!-- Conteúdo sobreposto ao alvo -->
                <a-plane
                    position="0 0 0"
                    width="1"
                    height="0.552"
                    material="color: #2196F3; opacity: 0.5; side: double;"
                ></a-plane>
            </a-entity>
        </a-scene>
    </div>
</body>
</html>
