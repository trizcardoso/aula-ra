<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebAR - MindAR + A-Frame</title>

```
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
    }

    body {
        position: fixed;
        inset: 0;
    }

    #ar-container {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
    }

    a-scene {
        width: 100%;
        height: 100%;
    }

    .mensagem {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        padding: 12px 18px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        font-family: Arial, sans-serif;
        font-size: 14px;
        text-align: center;
        pointer-events: none;
        max-width: 90%;
    }
</style>
```

</head>

<body>
    <div id="ar-container">

```
    <div id="mensagem" class="mensagem">
        Iniciando câmera...
    </div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        renderer="
            antialias: true;
            colorManagement: true;
            physicallyCorrectLights: true;
        "
        mindar-image="
            imageTargetSrc: ./targets.mind;
            autoStart: true;
            uiLoading: true;
            uiScanning: true;
            uiError: true;
            filterMinCF: 0.0001;
            filterBeta: 0.001;
            missTolerance: 5;
            warmupTolerance: 5;
        "
    >

        <a-camera
            position="0 0 0"
            look-controls="enabled: false"
            wasd-controls="enabled: false"
            fov="60"
        ></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">

            <a-plane
                position="0 0 0"
                rotation="0 0 0"
                width="1"
                height="0.552"
                material="
                    shader: flat;
                    color: #2196F3;
                    opacity: 0.5;
                    transparent: true;
                    side: double;
                "
            ></a-plane>

        </a-entity>

    </a-scene>
</div>

<script>
    const scene = document.querySelector("a-scene");
    const mensagem = document.getElementById("mensagem");

    scene.addEventListener("loaded", () => {
        mensagem.textContent = "Câmera iniciada. Aponte para a imagem-alvo.";
    });

    scene.addEventListener("arReady", () => {
        mensagem.textContent = "Aponte a câmera para a imagem-alvo.";
    });

    scene.addEventListener("arError", (event) => {
        console.error("Erro no MindAR:", event);
        mensagem.textContent = "Erro ao iniciar o AR. Verifique a câmera e o arquivo targets.mind.";
    });

    const target = document.querySelector("[mindar-image-target]");

    target.addEventListener("targetFound", () => {
        mensagem.textContent = "Imagem encontrada!";
    });

    target.addEventListener("targetLost", () => {
        mensagem.textContent = "Aponte novamente para a imagem-alvo.";
    });
</script>
```

</body>
</html>
