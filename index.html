<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teste WebAR</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .container {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <div class="container">

        <a-scene
            mindar-image="
                imageTargetSrc: ./targets.mind;
                autoStart: true;
                uiLoading: yes;
                uiScanning: yes;
                uiError: yes;
            "
            embedded
            color-space="sRGB"
            renderer="
                colorManagement: true;
                physicallyCorrectLights;
            "
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false"
        >

            <a-camera
                position="0 0 0"
                look-controls="enabled: false"
            ></a-camera>

            <a-entity
                mindar-image-target="targetIndex: 0"
            >
                <a-plane
                    color="blue"
                    opacity="0.5"
                    position="0 0 0"
                    height="0.552"
                    width="1"
                ></a-plane>
            </a-entity>

        </a-scene>

    </div>

</body>
</html>
